sentence=Universal WS2812 LED library for ESP32, with non-blocking RMT transmission and application-supplied hardware configuration (Provider pattern).
paragraph=Provides a unified API to drive one or more WS2812 LED buses through the ESP32 RMT peripheral, without bit-banging and without disabling interrupts. Hardware configuration (pins, LED count, RMT channel) is supplied by the application via the Ws2812ConfigProvider pattern, allowing coexistence with DCC RMT channels. Used in the Chemins de Fer du Chablais (CFC) DCC/model-railroad architecture.
